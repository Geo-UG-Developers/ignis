name: Servidor (pruebas e instalación en Supabase)

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/servidor.yml']
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas de la base de datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Correr pruebas
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: postgres
        run: ./supabase/tests/run.sh

  instalar:
    name: Instalar en Supabase
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Están los secretos?
        id: secretos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Faltan secretos de Supabase en GitHub (Settings > Secrets and variables > Actions). No se instala nada."
            echo "listo=no" >> "$GITHUB_OUTPUT"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secretos.outputs.listo == 'si'
        with:
          version: latest
      - name: Conectar con el proyecto
        if: steps.secretos.outputs.listo == 'si'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones y datos base
        if: steps.secretos.outputs.listo == 'si'
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes
