# Configuración mínima del CLI de Supabase para IGNIS.
project_id = "ignis"

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/00_regiones.sql", "./seed/10_municipios_gto.sql", "./seed/20_piloto.sql", "./seed/30_historico.sql"]

# Las funciones validan la sesión ellas mismas (Telegram no manda JWT y la app
# necesita la petición previa CORS sin JWT).
[functions.telegram]
verify_jwt = false

[functions.reportar]
verify_jwt = false

[functions.tareas]
verify_jwt = false

[functions.avisos]
verify_jwt = false

[functions.panel]
verify_jwt = false

[functions.salud]
verify_jwt = false
